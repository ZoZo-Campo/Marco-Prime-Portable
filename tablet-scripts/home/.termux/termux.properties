# Parametres Termux (lu au demarrage de l'appli / termux-reload-settings)
# Active l'execution de commandes depuis d'autres apps (intents externes,
# necessaire pour la page de relance et le raccourci).
# Redemarrez l'appli Termux apres modification, ou lancez : termux-reload-settings
allow-external-apps=true

# Historique de scroll plus confortable
terminal-scrollback=50000